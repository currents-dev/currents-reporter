# Cypress runs on 2 parallel jobs without any Currents package, variable or
# configuration. A later job uploads the results of both to one Currents run.
stages:
  - test
  - report

cypress:
  stage: test
  image:
    name: cypress/included:14.2.0
    entrypoint: ['']
  parallel: 2
  script:
    - npx cypress run --spec "$(node split-specs.js)"
  artifacts:
    when: always
    paths:
      - results/
      - cypress/screenshots/
      - cypress/videos/

currents:
  stage: report
  image: node:22
  # Downloads the artifacts of every parallel cypress job
  needs:
    - job: cypress
      artifacts: true
  when: always
  variables:
    CURRENTS_PROJECT_ID: <project id>
    CURRENTS_TAG: nightly
    CURRENTS_ENVIRONMENT: staging
    # GitLab passes CI/CD variables to every job, and Cypress does not run
    # when it finds CURRENTS_RECORD_KEY, CURRENTS_PROJECT_ID or
    # CURRENTS_API_URL. The record key is the masked CI/CD variable
    # CURRENTS_UPLOAD_KEY, set as CURRENTS_RECORD_KEY in this job only.
    CURRENTS_RECORD_KEY: $CURRENTS_UPLOAD_KEY
  script:
    - npx --yes @currents/cmd run upload --input-format cypress-json --input-file "results/cypress-results-*.json"
