# CodeRabbit configuration.
#
# The reason this file exists: `request_changes_workflow` below. Without it
# CodeRabbit only ever posts COMMENTED reviews, which do not count toward the
# 1-approval requirement on `main`.
#
# Keys not set here fall back to the organization's CodeRabbit UI settings.

language: 'en-US'

reviews:
  profile: 'chill'

  # Submit an approving review once CodeRabbit's own comments are resolved and
  # no pre-merge check is in an error state.
  request_changes_workflow: true

  high_level_summary: true
  high_level_summary_in_walkthrough: true

  # The file list, diagrams and effort estimate repeat what the diff already
  # shows and push the actual findings below the fold.
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  poem: false
  in_progress_fortune: false

  path_filters:
    - '!node_modules/**'
    - '!**/dist/**'
    - '!package-lock.json'
    # Generated by release-it.
    - '!**/CHANGELOG.md'
    # Committed junit/artifact fixtures, not source.
    - '!examples/junit/**'
    - '!**/*.min.js'

  path_instructions:
    - path: 'packages/cmd/src/**'
      instructions: |
        This is a published CLI. Treat these as review criteria:

        - Record keys and API tokens must not reach logs, debug output, or
          error payloads. Flag any `debug()`/`console` call that passes a raw
          axios error, request config, or request body, since those carry
          `recordKey`.
        - Config resolution goes through `getValidatedConfig` in
          `packages/cmd/src/config/utils.ts`: environment variables are spread
          after CLI options, so env wins, and only `undefined` values are
          dropped. An env parser that returns a defined value for an unset
          variable silently overrides the CLI flag. Booleans must go through
          `parseBooleanEnv`.
        - Commander option names are not config keys. A flag such as `--key`
          has to be mapped to its config key (`recordKey`) at the handler
          boundary before validation runs, or the flag in the help text fails
          validation. Ask for a test that exercises the flag with no
          environment variable set.
        - Exit non-zero on unexpected API failures. Treat a result as an
          expected outcome only when the success payload says so. Do not infer
          it from an HTTP status or an error message string: a missing route,
          an older self-hosted deployment, or a wrong api url produce the same
          404, and the wording of a remote error message is not this repo's to
          depend on.
        - Command names, flags, and `CURRENTS_*` environment variable names are
          user-facing. Call out anything that renames, removes, or changes the
          meaning of an existing one.

    - path: 'packages/cmd/src/{api,http}/**'
      instructions: |
        HTTP goes through the shared client in `packages/cmd/src/http`. Flag
        direct axios usage that bypasses its retry, error mapping, and secret
        masking, and flag new debug logging of request or response objects that
        has not had credentials removed.

    - path: '**/{__tests__/**,*.test.ts,*.spec.ts}'
      instructions: |
        Tests run under vitest. Prefer a failing case over an assertion on a
        mock call count, and check that error paths assert the exit code or the
        thrown error, not just that a log was written.

    - path: '.github/workflows/**'
      instructions: |
        These workflows publish to npm. Flag anything that widens a token's
        scope, exposes a secret to a step that runs code from a pull request,
        or runs untrusted PR code on a `pull_request_target` trigger.

    - path: 'examples/**'
      instructions: |
        Sample projects used to exercise the reporters against real frameworks.
        They deliberately contain failing, flaky, and skipped tests. Do not
        report those as defects and do not ask for style changes here.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    # Stacked PRs target a feature branch rather than main.
    base_branches:
      - 'main'
      - '^feat/.*$'

  pre_merge_checks:
    # This codebase does not use docstrings; the check only ever reports a
    # coverage number nobody acts on.
    docstrings:
      mode: 'off'

    title:
      mode: 'warning'
      requirements: |
        A conventional commit title (`type: description`), optionally prefixed
        with a Linear issue in brackets, e.g. `[ENG-1012] feat: add a cancel
        command`. Dependabot titles of the form `[CSR-0] chore: Bump <dep>` are
        acceptable as-is.

    description:
      mode: 'warning'

    issue_assessment:
      mode: 'warning'

  tools:
    # The repo lints with eslint + prettier. Biome and oxlint re-report the
    # same TypeScript files under a different rule set.
    biome:
      enabled: false
    oxc:
      enabled: false

    # Explicit rather than inherited: these are the checks that match what this
    # repo actually contains.
    eslint:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true

# This repository is public. Leaving the Linear and MCP integrations on 'auto'
# keeps them disabled here, so internal issue contents are not quoted into
# public pull request comments.
knowledge_base:
  linear:
    usage: 'auto'
  jira:
    usage: 'auto'
  mcp:
    usage: 'auto'
